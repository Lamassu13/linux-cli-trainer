<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Linux Command Line Trainer</title>
  <meta name="description" content="Learn and memorize the Linux command line with lessons, animated visualizations, a terminal simulator, flashcards and quizzes.">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Linux CLI">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Apply the saved theme before first paint (no flash). "system" leaves it to prefers-color-scheme.
    try { var t = (JSON.parse(localStorage.getItem('lcl.v1') || '{}').settings || {}).theme; if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Back" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a class="brand" href="#/" aria-label="Linux CLI Trainer home"><span class="brand-mark" aria-hidden="true">$_</span><span class="brand-name">Linux CLI</span></a>
    <div class="top-stats" id="topStats" aria-live="off"></div>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch to light theme">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
    </button>
    <a class="icon-btn" href="#/progress" aria-label="Progress, badges and settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
    </a>
  </header>

  <nav class="tabbar" id="tabbar" aria-label="Main">
    <a href="#/" data-tab="learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h7a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2H4zM20 5h-4a2 2 0 0 0-2 2"/><path d="M20 5v13h-6"/></svg><span>Learn</span></a>
    <a href="#/terminal" data-tab="terminal"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg><span>Terminal</span></a>
    <a href="#/cards" data-tab="cards"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg><span>Cards</span></a>
    <a href="#/quiz" data-tab="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg><span>Quiz</span></a>
    <a href="#/play" data-tab="play"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3M15.5 12h.01M18 13.5h.01"/></svg><span>Play</span></a>
    <a href="#/cheats" data-tab="cheats"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg><span>Cheats</span></a>
  </nav>

  <main id="main" tabindex="-1"></main>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-head"><h2 id="sheetTitle">Practice</h2><button class="icon-btn" type="button" data-close aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <div id="fx" class="fx" aria-hidden="true"></div>
  <noscript><p class="noscript">This trainer needs JavaScript to run.</p></noscript>

  <script src="js/content.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/srs.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
